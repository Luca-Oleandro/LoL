# docker-compose.yaml — Local Airflow setup "single machine" (LocalExecutor)
# Components:
#   - postgres        -> internal database for Airflow (metadata: DAG, run, task states)
#   - airflow-init    -> initialize the database and create the admin user
#   - airflow-webserver -> graphical interface (http://localhost:8080)
#   - airflow-scheduler -> DAG engine and time scheduler
#
# NOT included from original file: redis, celery-worker, flower, triggerer
# -> don't need them for LocalExecutor on a single machine.

x-airflow-common: &airflow-common
  build: .              # build the image from Dockerfile of this folder instead of pulling one from a registry
  image: lol-airflow:latest   # name of custom image once built
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'     
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}

  volumes:
    - ./dags:/opt/airflow/dags          # where DAG files physically live
    - ./logs:/opt/airflow/logs          # log of each run
    - ./plugins:/opt/airflow/plugins    # custom plugins directory (unused for now)
    - ./scripts:/opt/airflow/scripts    # where scripts files are
    - ./data/archive:/opt/airflow/data/archive # permanent local archive: compressed match JSON files + SQLite index
  user: "${AIRFLOW_UID:-50000}:0"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres-db-volume: